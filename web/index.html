<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M3U8 下载器</title>
<link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <div class="container">
    <h1>M3U8 下载器 <span class="badge" id="concBadge">-</span></h1>

    <div class="panel">
      <div class="grid">
        <div class="full">
          <label>M3U8 URL / 本地路径 *</label>
          <input id="m3u8_input" type="text" placeholder="https://example.com/playlist.m3u8" />
        </div>

        <div>
          <label>输出文件名 (--output)</label>
          <input id="output" type="text" value="output.ts" />
        </div>
        <div>
          <label>Base URL (--base_url)</label>
          <input id="base_url" type="text" placeholder="片段相对路径时的根 URL" />
        </div>

        <div>
          <label>并发数 (--workers)</label>
          <input id="workers" type="number" value="10" min="1" max="64" />
        </div>
        <div>
          <label>重试次数 (--retries)</label>
          <input id="retries" type="number" value="3" min="0" />
        </div>

        <div>
          <label>超时秒数 (--timeout)</label>
          <input id="timeout" type="number" value="5" min="1" />
        </div>
        <div>
          <label>代理 (--proxy)</label>
          <input id="proxy" type="text" placeholder="http://127.0.0.1:7890" />
        </div>

        <div>
          <label>Key 附加参数 (--key-param)</label>
          <input id="key_param" type="text" placeholder="token=xxx&sign=yyy" />
        </div>
        <div>
          <label>&nbsp;</label>
          <div class="checks" style="margin-top:0">
            <label><input type="checkbox" id="no_merge" /> 不合并</label>
            <label><input type="checkbox" id="keep_temp" /> 保留临时</label>
            <label><input type="checkbox" id="no_disk" /> 不落磁盘</label>
          </div>
        </div>

        <div class="full">
          <label>自定义请求头 (--header, 每行一个 Key:Value)</label>
          <textarea id="headers" placeholder="Referer: https://example.com&#10;User-Agent: Mozilla/5.0 ..."></textarea>
        </div>

        <details class="full">
          <summary>百度云盘上传选项 (可选)</summary>
          <div class="grid" style="margin-top:8px">
            <div>
              <label>远程目录 (--upload)</label>
              <input id="upload" type="text" placeholder="/apps/movies/my_video/" />
            </div>
            <div>
              <label>ACCESS_TOKEN (--upload-token)</label>
              <input id="upload_token" type="text" placeholder="不填则用 .env 中的" />
            </div>
            <div>
              <label>冲突策略 (--upload-ondup)</label>
              <select id="upload_ondup">
                <option value="overwrite">overwrite</option>
                <option value="fail">fail</option>
                <option value="newcopy">newcopy</option>
              </select>
            </div>
            <div>
              <label>上传重试 (--upload-retries)</label>
              <input id="upload_retries" type="number" value="5" min="0" />
            </div>
            <div class="full">
              <div class="checks">
                <label><input type="checkbox" id="upload_delete" checked /> 上传后删除本地分片</label>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div class="actions">
        <button id="btnAdd">添加下载任务</button>
        <button id="btnImport" class="secondary">批量导入</button>
        <button id="btnRefresh" class="secondary">刷新列表</button>
      </div>
    </div>

    <div class="panel">
      <h2>
        <span>任务列表</span>
        <button id="btnClearDone" class="secondary small">清除已结束</button>
      </h2>
      <div id="taskList"></div>
      <div id="emptyHint" class="empty">暂无任务</div>
    </div>
  </div>

  <!-- 批量导入弹窗 -->
  <div class="modal-mask" id="importModal" style="display:none">
    <div class="modal">
      <h3>批量导入任务</h3>
      <p class="hint">每行一个任务，格式：<code>文件名 URL</code>（空格分隔）。其余参数沿用当前表单设置。</p>
      <div class="modal-toolbar">
        <button type="button" class="secondary small" id="btnImportFile">选择 .txt 文件</button>
        <input type="file" id="importFile" accept=".txt,text/plain" style="display:none" />
        <span class="preview" id="importPreview"></span>
      </div>
      <textarea id="importText" placeholder="movie1 https://example.com/1.m3u8&#10;movie2 https://example.com/2.m3u8" style="min-height:160px"></textarea>
      <div class="modal-errors" id="importErrors" style="display:none"></div>
      <div class="modal-result" id="importResult" style="display:none"></div>
      <div class="actions">
        <button id="btnImportOk">导入</button>
        <button id="btnImportCancel" class="secondary">取消</button>
      </div>
    </div>
  </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
