<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M3U8 下载器</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #22c55e;
    --err: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 {
    margin: 0 0 24px 0;
    font-size: 22px;
    border-left: 4px solid var(--accent);
    padding-left: 12px;
  }
  h2 {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 12px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
  }
  .grid .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 8px 10px;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .checks {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    margin-top: 8px;
  }
  .checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    margin: 0;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    padding: 8px 18px;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: #0b1220;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.secondary {
    background: #334155;
    color: var(--text);
  }
  button.small {
    padding: 4px 10px;
    font-size: 12px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress-wrap {
    height: 18px;
    background: #0b1220;
    border-radius: 9px;
    overflow: hidden;
    margin: 6px 0;
    border: 1px solid var(--border);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
    width: 0%;
    transition: width 0.2s;
    text-align: center;
    color: #0b1220;
    font-size: 11px;
    line-height: 18px;
    font-weight: 700;
  }
  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
  }
  .stats b { color: var(--text); }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    margin: 8px 0;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #334155;
    color: var(--text);
  }
  .badge.pending   { background:#475569; color:#e2e8f0; }
  .badge.running   { background:#38bdf8; color:#0b1220; }
  .badge.done      { background:#22c55e; color:#0b1220; }
  .badge.error     { background:#ef4444; color:#fff; }
  .badge.cancelled { background:#f59e0b; color:#0b1220; }

  /* 任务卡片 */
  .task-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: #0b1220;
  }
  .task-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .task-title {
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    flex: 1;
  }
  .task-title .sub { color: var(--muted); font-size: 11px; }
  .task-ctl { display: flex; gap: 6px; flex-shrink: 0; }
  .task-log {
    margin-top: 6px;
    max-height: 140px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .task-log .l-ok  { color: var(--ok); }
  .task-log .l-err { color: var(--err); }
  .task-log .l-warn{ color: var(--warn); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
</style>
</head>
<body>
  <div class="container">
    <h1>M3U8 下载器 <span class="badge" id="concBadge">-</span></h1>

    <div class="panel">
      <div class="grid">
        <div class="full">
          <label>M3U8 URL / 本地路径 *</label>
          <input id="m3u8_input" type="text" placeholder="https://example.com/playlist.m3u8" />
        </div>

        <div>
          <label>输出文件名 (--output)</label>
          <input id="output" type="text" value="output.ts" />
        </div>
        <div>
          <label>Base URL (--base_url)</label>
          <input id="base_url" type="text" placeholder="片段相对路径时的根 URL" />
        </div>

        <div>
          <label>并发数 (--workers)</label>
          <input id="workers" type="number" value="10" min="1" max="64" />
        </div>
        <div>
          <label>重试次数 (--retries)</label>
          <input id="retries" type="number" value="3" min="0" />
        </div>

        <div>
          <label>超时秒数 (--timeout)</label>
          <input id="timeout" type="number" value="5" min="1" />
        </div>
        <div>
          <label>代理 (--proxy)</label>
          <input id="proxy" type="text" placeholder="http://127.0.0.1:7890" />
        </div>

        <div>
          <label>Key 附加参数 (--key-param)</label>
          <input id="key_param" type="text" placeholder="token=xxx&sign=yyy" />
        </div>
        <div>
          <label>&nbsp;</label>
          <div class="checks" style="margin-top:0">
            <label><input type="checkbox" id="no_merge" /> 不合并</label>
            <label><input type="checkbox" id="keep_temp" /> 保留临时</label>
            <label><input type="checkbox" id="no_disk" /> 不落磁盘</label>
          </div>
        </div>

        <div class="full">
          <label>自定义请求头 (--header, 每行一个 Key:Value)</label>
          <textarea id="headers" placeholder="Referer: https://example.com&#10;User-Agent: Mozilla/5.0 ..."></textarea>
        </div>

        <details class="full">
          <summary>百度云盘上传选项 (可选)</summary>
          <div class="grid" style="margin-top:8px">
            <div>
              <label>远程目录 (--upload)</label>
              <input id="upload" type="text" placeholder="/apps/movies/my_video/" />
            </div>
            <div>
              <label>ACCESS_TOKEN (--upload-token)</label>
              <input id="upload_token" type="text" placeholder="不填则用 .env 中的" />
            </div>
            <div>
              <label>冲突策略 (--upload-ondup)</label>
              <select id="upload_ondup">
                <option value="overwrite">overwrite</option>
                <option value="fail">fail</option>
                <option value="newcopy">newcopy</option>
              </select>
            </div>
            <div>
              <label>上传重试 (--upload-retries)</label>
              <input id="upload_retries" type="number" value="5" min="0" />
            </div>
            <div class="full">
              <div class="checks">
                <label><input type="checkbox" id="upload_delete" checked /> 上传后删除本地分片</label>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div class="actions">
        <button id="btnAdd">添加下载任务</button>
        <button id="btnRefresh" class="secondary">刷新列表</button>
      </div>
    </div>

    <div class="panel">
      <h2>
        <span>任务列表</span>
        <button id="btnClearDone" class="secondary small">清除已结束</button>
      </h2>
      <div id="taskList"></div>
      <div id="emptyHint" class="empty">暂无任务</div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

// 计算 API 地址, 相对当前页面所在目录, 兼容 nginx 路径转发 (如 /m3u8/)
function apiUrl(path) {
  const base = location.pathname.replace(/[^/]*$/, "");  // 去掉文件名保留目录, 末尾带 /
  return base + path.replace(/^\//, "");
}

// ---- 表单记忆 (localStorage) --------------------------------------------
// 需要持久化的表单字段 id
const FORM_FIELDS = [
  "m3u8_input", "output", "base_url", "workers", "retries", "timeout",
  "proxy", "key_param", "headers",
  "no_merge", "keep_temp", "no_disk",
  "upload", "upload_token", "upload_ondup", "upload_retries", "upload_delete",
];
const FORM_STORE_KEY = "m3u8_last_form";

// 读取单个字段的值 (兼容 checkbox / 普通输入)
function getFieldValue(id) {
  const el = $(id);
  if (!el) return undefined;
  return el.type === "checkbox" ? el.checked : el.value;
}

// 写入单个字段的值
function setFieldValue(id, value) {
  const el = $(id);
  if (!el || value === undefined || value === null) return;
  if (el.type === "checkbox") el.checked = !!value;
  else el.value = value;
}

// 保存当前表单到 localStorage
function saveForm() {
  const data = {};
  for (const id of FORM_FIELDS) {
    const v = getFieldValue(id);
    if (v !== undefined) data[id] = v;
  }
  try { localStorage.setItem(FORM_STORE_KEY, JSON.stringify(data)); }
  catch (e) { /* 隐私模式/超配额时忽略 */ }
}

// 从 localStorage 恢复表单
function restoreForm() {
  let data;
  try { data = JSON.parse(localStorage.getItem(FORM_STORE_KEY) || "null"); }
  catch (e) { return; }
  if (!data) return;
  for (const id of FORM_FIELDS) setFieldValue(id, data[id]);
}

// 已渲染的任务: id -> { card, bar, statusEl, doneEl, totalEl, sizeEl, logEl, streaming, aborter }
const tasks = {};

function humanSize(n) {
  if (n == null) return "-";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
}

const TERMINAL = new Set(["done", "error", "cancelled"]);

function collectRequest() {
  const headersRaw = $("headers").value.trim();
  const headers = headersRaw
    ? headersRaw.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
    : null;

  const req = {
    m3u8_input: $("m3u8_input").value.trim(),
    output: $("output").value.trim() || "output.ts",
    base_url: $("base_url").value.trim() || null,
    workers: parseInt($("workers").value) || 10,
    retries: parseInt($("retries").value) || 3,
    timeout: parseInt($("timeout").value) || 5,
    proxy: $("proxy").value.trim() || null,
    keep_temp: $("keep_temp").checked,
    headers: headers,
    key_param: $("key_param").value.trim() || null,
    no_merge: $("no_merge").checked,
    no_disk: $("no_disk").checked,
  };
  const upload = $("upload").value.trim();
  if (upload) {
    req.upload = upload;
    req.upload_token = $("upload_token").value.trim() || null;
    req.upload_ondup = $("upload_ondup").value;
    req.upload_retries = parseInt($("upload_retries").value) || 5;
    req.upload_delete = $("upload_delete").checked;
  }
  return req;
}

// ---- 任务卡片渲染 --------------------------------------------------------

function ensureCard(snap) {
  let t = tasks[snap.id];
  if (t) return t;

  const card = document.createElement("div");
  card.className = "task-card";
  card.id = "task-" + snap.id;
  card.innerHTML = `
    <div class="task-head">
      <div class="task-title">
        <div class="in"></div>
        <div class="sub"></div>
      </div>
      <div class="task-ctl">
        <span class="badge status">pending</span>
        <button class="secondary small btn-cancel">取消</button>
        <button class="secondary small btn-remove" style="display:none">删除</button>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar">0%</div></div>
    <div class="stats">
      <div>片段: <b class="done">0</b>/<b class="total">0</b></div>
      <div>加密: <b class="enc">-</b></div>
      <div>大小: <b class="size">-</b></div>
      <div class="result-wrap" style="display:none">结果: <b class="result"></b></div>
    </div>
    <details><summary>日志</summary><div class="task-log"></div></details>
  `;
  $("taskList").prepend(card);
  $("emptyHint").style.display = "none";

  t = {
    id: snap.id,
    card,
    bar: card.querySelector(".progress-bar"),
    statusEl: card.querySelector(".status"),
    doneEl: card.querySelector(".done"),
    totalEl: card.querySelector(".total"),
    encEl: card.querySelector(".enc"),
    sizeEl: card.querySelector(".size"),
    resultWrap: card.querySelector(".result-wrap"),
    resultEl: card.querySelector(".result"),
    logEl: card.querySelector(".task-log"),
    btnCancel: card.querySelector(".btn-cancel"),
    btnRemove: card.querySelector(".btn-remove"),
    streaming: false,
    aborter: null,
  };
  card.querySelector(".task-title .in").textContent = snap.input || snap.id;
  card.querySelector(".task-title .sub").textContent =
    (snap.output || "") + "  ·  #" + snap.id;

  t.btnCancel.addEventListener("click", () => cancelTask(snap.id));
  t.btnRemove.addEventListener("click", () => removeTask(snap.id));

  tasks[snap.id] = t;
  return t;
}

function tlog(t, msg, cls = "") {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  t.logEl.appendChild(line);
  t.logEl.scrollTop = t.logEl.scrollHeight;
}

function setStatusBadge(t, status) {
  t.statusEl.textContent = status;
  t.statusEl.className = "badge status " + status;
  const terminal = TERMINAL.has(status);
  t.btnCancel.style.display = terminal ? "none" : "";
  t.btnRemove.style.display = terminal ? "" : "none";
}

function setProgress(t, done, total) {
  const p = total > 0 ? (done / total * 100) : 0;
  t.bar.style.width = p.toFixed(1) + "%";
  t.bar.textContent = p.toFixed(1) + "%";
  t.doneEl.textContent = done;
  t.totalEl.textContent = total;
}

function applySnapshot(t, snap) {
  setStatusBadge(t, snap.status);
  setProgress(t, snap.done || 0, snap.total || 0);
  if (snap.encrypted != null) t.encEl.textContent = snap.encrypted ? "AES-128" : "否";
  if (snap.size != null) t.sizeEl.textContent = humanSize(snap.size);
  if (snap.result) { t.resultWrap.style.display = ""; t.resultEl.textContent = snap.result; }
}

// ---- 事件流订阅 ----------------------------------------------------------

async function subscribe(id) {
  const t = tasks[id];
  if (!t || t.streaming) return;
  t.streaming = true;
  t.aborter = new AbortController();

  try {
    const resp = await fetch(apiUrl(`/api/tasks/${id}/stream`), { signal: t.aborter.signal });
    if (!resp.ok) { tlog(t, "订阅失败 HTTP " + resp.status, "l-err"); return; }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (line) handleEvent(t, line);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") tlog(t, "流异常: " + e.message, "l-err");
  } finally {
    t.streaming = false;
    t.aborter = null;
  }
}

function handleEvent(t, line) {
  let ev;
  try { ev = JSON.parse(line); } catch { return; }

  switch (ev.type) {
    case "connected": break;
    case "start":
      tlog(t, "任务启动 → " + ev.output);
      break;
    case "playlist":
      t.encEl.textContent = ev.encrypted ? "AES-128" : "否";
      setProgress(t, 0, ev.total);
      tlog(t, `解析完成: ${ev.total} 片段, 加密=${ev.encrypted}`);
      break;
    case "segment":
      setProgress(t, ev.done, ev.total);
      if (ev.done === 1 || ev.done % 25 === 0 || ev.done === ev.total)
        tlog(t, `片段 ${ev.done}/${ev.total}`);
      break;
    case "all_downloaded":
      tlog(t, "全部下载完成, 合并/收尾...", "l-ok");
      break;
    case "status":
      setStatusBadge(t, ev.status);
      if (ev.status === "done") {
        tlog(t, "✔ 完成: " + (ev.result || "") + " (" + humanSize(ev.size) + ")", "l-ok");
        if (ev.result) { t.resultWrap.style.display = ""; t.resultEl.textContent = ev.result; }
        if (ev.size != null) t.sizeEl.textContent = humanSize(ev.size);
      } else if (ev.status === "error") {
        tlog(t, "✘ 错误: " + (ev.message || ""), "l-err");
      } else if (ev.status === "cancelled") {
        tlog(t, "已取消 (" + (ev.reason || "") + ")", "l-warn");
      } else if (ev.status === "running") {
        tlog(t, "开始运行");
      }
      break;
    case "heartbeat": break;
  }
}

// ---- 操作 ----------------------------------------------------------------

async function addTask() {
  const req = collectRequest();
  if (!req.m3u8_input) { alert("请输入 M3U8 URL 或路径"); return; }

  $("btnAdd").disabled = true;
  try {
    const resp = await fetch(apiUrl("/api/download"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(req),
    });
    if (!resp.ok) { alert("创建失败: HTTP " + resp.status); return; }
    const { task_id } = await resp.json();
    saveForm();  // 提交成功后记住本次表单
    const t = ensureCard({ id: task_id, input: req.m3u8_input, output: req.output, status: "pending" });
    subscribe(task_id);
  } catch (e) {
    alert("请求异常: " + e.message);
  } finally {
    $("btnAdd").disabled = false;
  }
}

async function cancelTask(id) {
  try {
    await fetch(apiUrl(`/api/tasks/${id}/cancel`), { method: "POST" });
  } catch (e) { /* ignore */ }
}

async function removeTask(id) {
  const t = tasks[id];
  if (t && t.aborter) t.aborter.abort();
  try {
    const resp = await fetch(apiUrl(`/api/tasks/${id}`), { method: "DELETE" });
    if (!resp.ok) { alert("删除失败(任务未结束?)"); return; }
  } catch (e) { return; }
  if (t) t.card.remove();
  delete tasks[id];
  if (Object.keys(tasks).length === 0) $("emptyHint").style.display = "";
}

async function refresh() {
  try {
    const resp = await fetch(apiUrl("/api/tasks"));
    const data = await resp.json();
    for (const snap of data.tasks) {
      const t = ensureCard(snap);
      applySnapshot(t, snap);
      if (!TERMINAL.has(snap.status)) subscribe(snap.id);
    }
  } catch (e) { /* ignore */ }
}

async function clearDone() {
  const ids = Object.keys(tasks);
  for (const id of ids) {
    const t = tasks[id];
    if (TERMINAL.has(t.statusEl.textContent)) await removeTask(id);
  }
}

async function loadHealth() {
  try {
    const resp = await fetch(apiUrl("/api/health"));
    const d = await resp.json();
    $("concBadge").textContent = "并发上限 " + d.max_concurrent;
  } catch { $("concBadge").textContent = "离线"; }
}

$("btnAdd").addEventListener("click", addTask);
$("btnRefresh").addEventListener("click", refresh);
$("btnClearDone").addEventListener("click", clearDone);

restoreForm();
loadHealth();
refresh();
</script>
</body>
</html>
