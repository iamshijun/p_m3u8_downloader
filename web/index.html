<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M3U8 下载器</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #22c55e;
    --err: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 {
    margin: 0 0 24px 0;
    font-size: 22px;
    border-left: 4px solid var(--accent);
    padding-left: 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
  }
  .grid .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 8px 10px;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .checks {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    margin-top: 8px;
  }
  .checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    margin: 0;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    padding: 8px 18px;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: #0b1220;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.secondary {
    background: #334155;
    color: var(--text);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress-wrap {
    height: 20px;
    background: #0b1220;
    border-radius: 10px;
    overflow: hidden;
    margin: 8px 0 14px 0;
    border: 1px solid var(--border);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
    width: 0%;
    transition: width 0.2s;
    text-align: center;
    color: #0b1220;
    font-size: 12px;
    line-height: 20px;
    font-weight: 700;
  }
  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
  }
  .stats b { color: var(--text); }
  .log {
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    height: 280px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log .l-info  { color: var(--text); }
  .log .l-ok    { color: var(--ok); }
  .log .l-warn  { color: var(--warn); }
  .log .l-err   { color: var(--err); }
  .log .l-dim   { color: var(--muted); }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    margin: 8px 0;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #334155;
    color: var(--text);
    margin-left: 6px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>M3U8 下载器 <span class="badge" id="statusBadge">idle</span></h1>

    <div class="panel">
      <div class="grid">
        <div class="full">
          <label>M3U8 URL / 本地路径 *</label>
          <input id="m3u8_input" type="text" placeholder="https://example.com/playlist.m3u8" />
        </div>

        <div>
          <label>输出文件名 (--output)</label>
          <input id="output" type="text" value="output.ts" />
        </div>
        <div>
          <label>Base URL (--base_url)</label>
          <input id="base_url" type="text" placeholder="片段相对路径时的根 URL" />
        </div>

        <div>
          <label>并发数 (--workers)</label>
          <input id="workers" type="number" value="10" min="1" max="64" />
        </div>
        <div>
          <label>重试次数 (--retries)</label>
          <input id="retries" type="number" value="3" min="0" />
        </div>

        <div>
          <label>超时秒数 (--timeout)</label>
          <input id="timeout" type="number" value="5" min="1" />
        </div>
        <div>
          <label>代理 (--proxy)</label>
          <input id="proxy" type="text" placeholder="http://127.0.0.1:7890" />
        </div>

        <div>
          <label>临时目录 (--tmp-dir)</label>
          <input id="tmp_dir" type="text" placeholder="不填则自动创建" />
        </div>
        <div>
          <label>Key 附加参数 (--key-param)</label>
          <input id="key_param" type="text" placeholder="token=xxx&sign=yyy" />
        </div>

        <div class="full">
          <label>自定义请求头 (--header, 每行一个 Key:Value)</label>
          <textarea id="headers" placeholder="Referer: https://example.com&#10;User-Agent: Mozilla/5.0 ..."></textarea>
        </div>

        <div class="full">
          <div class="checks">
            <label><input type="checkbox" id="no_merge" /> 不合并 (--no-merge)</label>
            <label><input type="checkbox" id="keep_temp" /> 保留临时目录 (--keep-temp)</label>
            <label><input type="checkbox" id="no_disk" /> 不落磁盘 (--no-disk)</label>
          </div>
        </div>

        <details class="full">
          <summary>百度云盘上传选项 (可选)</summary>
          <div class="grid" style="margin-top:8px">
            <div>
              <label>远程目录 (--upload)</label>
              <input id="upload" type="text" placeholder="/apps/movies/my_video/" />
            </div>
            <div>
              <label>ACCESS_TOKEN (--upload-token)</label>
              <input id="upload_token" type="text" placeholder="不填则用 .env 中的" />
            </div>
            <div>
              <label>冲突策略 (--upload-ondup)</label>
              <select id="upload_ondup">
                <option value="overwrite">overwrite</option>
                <option value="fail">fail</option>
                <option value="newcopy">newcopy</option>
              </select>
            </div>
            <div>
              <label>上传重试 (--upload-retries)</label>
              <input id="upload_retries" type="number" value="5" min="0" />
            </div>
            <div class="full">
              <div class="checks">
                <label><input type="checkbox" id="upload_delete" checked /> 上传后删除本地分片</label>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div class="actions">
        <button id="btnStart">开始下载</button>
        <button id="btnStop" class="secondary" disabled>中止</button>
        <button id="btnClear" class="secondary">清空日志</button>
      </div>
    </div>

    <div class="panel">
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar">0%</div>
      </div>
      <div class="stats">
        <div>已完成: <b id="statDone">0</b> / <b id="statTotal">0</b></div>
        <div>加密: <b id="statEnc">-</b></div>
        <div>结果: <b id="statResult">-</b></div>
        <div>大小: <b id="statSize">-</b></div>
      </div>
    </div>

    <div class="panel">
      <div id="log" class="log"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
let abortCtl = null;

// 计算 API 地址, 相对当前页面所在目录, 兼容 nginx 路径转发 (如 /m3u8/)
function apiUrl(path) {
  const base = location.pathname.replace(/[^/]*$/, "");  // 去掉文件名保留目录, 末尾带 /
  return base + path.replace(/^\//, "");
}

function log(msg, cls = "l-info") {
  const box = $("log");
  const line = document.createElement("div");
  line.className = cls;
  const t = new Date().toLocaleTimeString();
  line.textContent = `[${t}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function humanSize(n) {
  if (n == null) return "-";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
}

function setStatus(text, color) {
  const b = $("statusBadge");
  b.textContent = text;
  b.style.background = color || "#334155";
  b.style.color = color ? "#0b1220" : "#e2e8f0";
}

function setProgress(done, total) {
  const p = total > 0 ? (done / total * 100) : 0;
  $("progressBar").style.width = p.toFixed(1) + "%";
  $("progressBar").textContent = p.toFixed(1) + "%";
  $("statDone").textContent = done;
  $("statTotal").textContent = total;
}

function collectRequest() {
  const headersRaw = $("headers").value.trim();
  const headers = headersRaw
    ? headersRaw.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
    : null;

  const req = {
    m3u8_input: $("m3u8_input").value.trim(),
    output: $("output").value.trim() || "output.ts",
    base_url: $("base_url").value.trim() || null,
    workers: parseInt($("workers").value) || 10,
    retries: parseInt($("retries").value) || 3,
    timeout: parseInt($("timeout").value) || 5,
    proxy: $("proxy").value.trim() || null,
    tmp_dir: $("tmp_dir").value.trim() || null,
    keep_temp: $("keep_temp").checked,
    headers: headers,
    key_param: $("key_param").value.trim() || null,
    no_merge: $("no_merge").checked,
    no_disk: $("no_disk").checked,
  };

  const upload = $("upload").value.trim();
  if (upload) {
    req.upload = upload;
    req.upload_token = $("upload_token").value.trim() || null;
    req.upload_ondup = $("upload_ondup").value;
    req.upload_retries = parseInt($("upload_retries").value) || 5;
    req.upload_delete = $("upload_delete").checked;
  }
  return req;
}

async function start() {
  const req = collectRequest();
  if (!req.m3u8_input) {
    alert("请输入 M3U8 URL 或路径");
    return;
  }

  $("btnStart").disabled = true;
  $("btnStop").disabled = false;
  setStatus("running", "#38bdf8");
  setProgress(0, 0);
  $("statEnc").textContent = "-";
  $("statResult").textContent = "-";
  $("statSize").textContent = "-";

  log("开始下载: " + req.m3u8_input, "l-info");

  abortCtl = new AbortController();
  try {
    const resp = await fetch(apiUrl("/api/download"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(req),
      signal: abortCtl.signal,
    });
    if (!resp.ok) {
      const text = await resp.text();
      log("HTTP " + resp.status + ": " + text, "l-err");
      setStatus("error", "#ef4444");
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (line) handleEvent(line);
      }
    }
    if (buffer.trim()) handleEvent(buffer.trim());

  } catch (e) {
    if (e.name === "AbortError") {
      log("已中止", "l-warn");
      setStatus("aborted", "#f59e0b");
    } else {
      log("请求异常: " + e.message, "l-err");
      setStatus("error", "#ef4444");
    }
  } finally {
    $("btnStart").disabled = false;
    $("btnStop").disabled = true;
    abortCtl = null;
  }
}

function handleEvent(line) {
  let ev;
  try { ev = JSON.parse(line); }
  catch (e) { log("非 JSON: " + line, "l-dim"); return; }

  switch (ev.type) {
    case "connected":
      log("已连接", "l-dim");
      break;
    case "start":
      log("任务启动 → " + ev.output, "l-info");
      break;
    case "playlist":
      log(`m3u8 已解析: 共 ${ev.total} 个片段, 加密=${ev.encrypted}`, "l-info");
      $("statEnc").textContent = ev.encrypted ? "AES-128" : "否";
      setProgress(0, ev.total);
      break;
    case "segment":
    case "segment_data":
      setProgress(ev.done, ev.total);
      // 只在关键节点打日志避免刷屏
      if (ev.done === 1 || ev.done % 20 === 0 || ev.done === ev.total) {
        log(`片段 ${ev.done}/${ev.total} 完成`, "l-dim");
      }
      break;
    case "all_downloaded":
      log("全部片段下载完成, 开始合并/收尾...", "l-ok");
      break;
    case "finish":
      log("finish hook: " + ev.result, "l-dim");
      break;
    case "done":
      log("✔ 下载完成: " + ev.result + " (" + humanSize(ev.size) + ")", "l-ok");
      $("statResult").textContent = ev.result;
      $("statSize").textContent = humanSize(ev.size);
      setStatus("done", "#22c55e");
      break;
    case "error":
      log("✘ 错误: " + ev.message, "l-err");
      setStatus("error", "#ef4444");
      break;
    case "heartbeat":
      // 静默
      break;
    default:
      log(JSON.stringify(ev), "l-dim");
  }
}

$("btnStart").addEventListener("click", start);
$("btnStop").addEventListener("click", () => {
  if (abortCtl) abortCtl.abort();
});
$("btnClear").addEventListener("click", () => { $("log").innerHTML = ""; });
</script>
</body>
</html>
